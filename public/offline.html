<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05040d" />
    <title>Offline · Map of Psy</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05040d; color: #ece9ff;
             font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 420px; border: 1px solid #2a2540; border-left: 2px solid #3ee6c4; padding: 24px; background: #0c0a18; }
      .tag { font: 11px ui-monospace, monospace; letter-spacing: 0.14em; color: #3ee6c4; text-transform: uppercase; }
      h1 { margin: 8px 0 12px; font-size: 24px; }
      p { margin: 0 0 16px; color: #a9a3c8; }
      button { font: 12px ui-monospace, monospace; letter-spacing: 0.1em; text-transform: uppercase; color: #05040d;
               background: #3ee6c4; border: 0; padding: 10px 16px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">// Signal lost</div>
      <h1>You are offline</h1>
      <p>Map of Psy needs the internet for the map and the events. Try again when you have a connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
