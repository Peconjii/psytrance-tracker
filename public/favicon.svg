<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <ellipse id="outer" cx="32" cy="14" rx="5.5" ry="11"/>
    <ellipse id="inner" cx="32" cy="22" rx="3.5" ry="7"/>
  </defs>
  <rect width="64" height="64" rx="14" fill="#020617"/>

  <!-- Mandala: eight outer petals, eight inner petals between them, a ring and a center -->
  <g fill="none" stroke="url(#g)" stroke-width="2.6">
    <use href="#outer"/>
    <use href="#outer" transform="rotate(45 32 32)"/>
    <use href="#outer" transform="rotate(90 32 32)"/>
    <use href="#outer" transform="rotate(135 32 32)"/>
    <use href="#outer" transform="rotate(180 32 32)"/>
    <use href="#outer" transform="rotate(225 32 32)"/>
    <use href="#outer" transform="rotate(270 32 32)"/>
    <use href="#outer" transform="rotate(315 32 32)"/>
  </g>
  <g fill="#d946ef" fill-opacity="0.55">
    <use href="#inner" transform="rotate(22.5 32 32)"/>
    <use href="#inner" transform="rotate(67.5 32 32)"/>
    <use href="#inner" transform="rotate(112.5 32 32)"/>
    <use href="#inner" transform="rotate(157.5 32 32)"/>
    <use href="#inner" transform="rotate(202.5 32 32)"/>
    <use href="#inner" transform="rotate(247.5 32 32)"/>
    <use href="#inner" transform="rotate(292.5 32 32)"/>
    <use href="#inner" transform="rotate(337.5 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="8" fill="#020617" stroke="#22d3ee" stroke-width="2.6"/>
  <circle cx="32" cy="32" r="3.2" fill="#22d3ee"/>
</svg>
